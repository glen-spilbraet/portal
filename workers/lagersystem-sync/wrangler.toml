name = "lagersystem-sync"
main = "src/index.js"
compatibility_date = "2025-04-25"

[observability]
enabled = true

# Nightly (01:30 UTC = 02:30/03:30 Danish time): incremental sweep of FINISHED
# (handled) + full refresh of the active queues + stock snapshot, then the
# per-SKU activity rollup (wms_sku_activity), then the portals are asked to
# pre-build their Warehouse cache. One run a day keeps load on the shared
# portal-db low; the dashboard shows data up to last night.
[triggers]
crons = ["30 1 * * *"]

# Writes into the shared PRODUCTION portal-db. The portal reads these tables
# through its SALES_DB binding (always prod portal-db), so dev and prod share
# one copy — same pattern as hubspot-sales-sync. Read-only mirror of
# Lagersystem; the portal never edits it.
[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "2dca2f5d-21fd-4515-ba49-d5970c249571"

[vars]
# Oldest FINISHED order to pull on a cold start (no prior sync), in days back.
BACKFILL_DAYS = "540"
# Portals whose Warehouse cache is warmed after the nightly run (POST
# <url>/api/warehouse/warm with Bearer SYNC_SECRET). Comma-separated.
PORTAL_URLS = "https://portal.spilbraet.dk,https://dev.portal-4pg.pages.dev"

# Secrets (set with `wrangler secret put <NAME>`), NOT stored here:
#   LAGERSYSTEM_API_KEY - read-only Lagersystem API key (X-APIKEY header)
#   SYNC_SECRET         - bearer token required to trigger a manual run via HTTP
