name = "lagersystem-sync"
main = "src/index.js"
compatibility_date = "2025-04-25"

[observability]
enabled = true

# Hourly: incremental sweep of FINISHED (handled) + a full refresh of the
# active queues (received / in-progress). Keeps the Warehouse dashboard current.
[triggers]
crons = ["15 * * * *"]

# Writes into the shared PRODUCTION portal-db. The portal reads these tables
# through its SALES_DB binding (always prod portal-db), so dev and prod share
# one copy — same pattern as hubspot-sales-sync. Read-only mirror of
# Lagersystem; the portal never edits it.
[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "2dca2f5d-21fd-4515-ba49-d5970c249571"

[vars]
# Oldest FINISHED order to pull on a cold start (no prior sync), in days back.
BACKFILL_DAYS = "540"

# Secrets (set with `wrangler secret put <NAME>`), NOT stored here:
#   LAGERSYSTEM_API_KEY - read-only Lagersystem API key (X-APIKEY header)
#   SYNC_SECRET         - bearer token required to trigger a manual run via HTTP
