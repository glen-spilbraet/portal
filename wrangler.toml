name = "portal"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2025-04-25"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "2dca2f5d-21fd-4515-ba49-d5970c249571"

[env.preview.d1_databases]
binding = "DB"
database_name = "portal-db-dev"
database_id = "57e39bf4-7c9e-4f12-a109-48c5cd8dd2e3"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "portal-images"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "portal-photos"

[browser]
binding = "BROWSER"
